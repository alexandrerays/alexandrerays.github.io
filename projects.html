<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Alexandre Ray</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0b0f13;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    a {
      color: #67e8f9;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* --- Header --- */
    .topbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .avatar img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    nav a {
      color: #e5e7eb;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    nav a:hover {
      background: #1f2937;
    }

    /* --- Main Content --- */
    .container {
      width: 100%;
      max-width: 720px;
      padding: 20px;
      text-align: left; /* left-aligned text */
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }

    ul {
      list-style-type: square;
      padding-left: 25px;
      line-height: 1.7;
      margin-top: 10px;
    }

    li strong {
      color: #22d3ee;
    }

    /* --- Footer --- */
    footer {
      margin-top: 60px;
      color: #9ca3af;
      text-align: center;
      padding: 20px 0;
      width: 100%;
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
      .avatar img {
        width: 90px;
        height: 90px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .container {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="avatar">
      <img src="assets/photo.jpeg" alt="Alexandre Ray">
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="publications.html">Publications</a>
      <a href="bio.html">Bio</a>
    </nav>
  </header>

  <main class="container">
    <h1>Projects</h1>
    <br>
    <ul>
      <li>
        2024 - <strong><a href="https://oncoai.com.br/oncocare" target="_blank">OncoCare</a></strong> is an AI-powered app for oncology patient care and nutrition.
      </li>
      <br>
      <li>
        2023 - <strong><a href="http://www.oncoai.com.br" target="_blank">OncoAI</a></strong> is an AI for cancer recurrence prediction and patient journey management.
      </li>
    </ul>

    <footer>
      <p>© <span id="year"></span> Alexandre Ray</p>
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
